name: Codespace Remote Command
on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Command to run on codespace'
        required: true
        default: 'echo hello'
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_CS_PAT }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure codespace is running
        run: |
          STATE=$(gh api /user/codespaces/symmetrical-invention-g4g6pvp5gqgr2qv5 --jq '.state')
          echo "Codespace state: $STATE"
          if [ "$STATE" != "Available" ]; then
            gh api -X POST /user/codespaces/symmetrical-invention-g4g6pvp5gqgr2qv5/start
            for i in $(seq 1 30); do
              sleep 10
              STATE=$(gh api /user/codespaces/symmetrical-invention-g4g6pvp5gqgr2qv5 --jq '.state')
              echo "[$i] $STATE"
              if [ "$STATE" = "Available" ]; then break; fi
            done
          fi

      - name: Run command on codespace
        run: |
          gh cs ssh -c symmetrical-invention-g4g6pvp5gqgr2qv5 -- "bash -lc '${{ inputs.command }}'" 2>&1 | tee output.txt
          exit 0
        timeout-minutes: 10

      - name: Push output to repo
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          mkdir -p artifacts/ci-output
          cp output.txt "artifacts/ci-output/$(date -u +%Y%m%d-%H%M%S).txt"
          git add artifacts/ci-output/
          git commit -m "ci: command output $(date -u +%H:%M:%S)" || true
          git push || true
